name: oynika
description: "Arkadaş ortamları için çevrimdışı parti oyunları uygulaması."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  sensors_plus: 6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/oynika_logo.png
    - assets/branding/oynika_logo_borderless.png
    - assets/data/tabu_cards.json
    - assets/data/sessiz_sinema_cards.json
    - assets/data/who_am_i_cards.json
    - assets/illustrations/
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 900
